# GENERAL
general {
    hide_cursor = false
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 2
    # blur_size = 6
    noise = 0.015
    contrast = 0.8
    brightness = 0.5
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, .9)
    font_size = 160
    font_family = steelfish outline regular
    position = 0, 300
    halign = center
    valign = center
}

