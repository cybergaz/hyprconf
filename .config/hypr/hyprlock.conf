# Foreground
image {
    monitor =
    path = ~/Downloads/wallpapers/wallhaven-9oz7o8_1920x1080.png
    size = 700
    border_size = 0
    rounding = 40
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = 0, -66
    halign = center
    valign = center
}

# Greetings
label {
    monitor =
    text = Hi, Gaz
    color = rgba(216, 222, 233, 0.80)
    font_size = 30
    font_family = comfortaa
    position = 0, 0
    halign = center
    valign = center
}

