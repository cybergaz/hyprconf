# INPUT FIELD
input-field {
    monitor =
    size = 90, 90
    outline_thickness = 2
    dots_size = 0.4 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.4 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color =rgba(0, 1, 11, 0.4) 
    inner_color = rgba(0, 1, 11, 0.1)
    font_color = rgb(0, 0, 0)
    fade_on_empty = false
    font_family = comfortaa
    placeholder_text = <span foreground="##343440">   Password   </span>
    hide_input = true
    position = 0, -220
    rounding = -1
    halign = center
    valign = center
}

